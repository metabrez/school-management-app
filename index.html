<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management System - Public View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100">

    <div id="public-page-container" class="flex flex-col min-h-screen">
        <header class="bg-white shadow-md sticky top-0 z-10">
            <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-800">Hamro School</h1>
                <div class="flex items-center space-x-4">
                    <a href="#home" class="public-nav-link text-gray-600 hover:text-blue-500">Home</a>
                    <a href="#news" class="public-nav-link text-gray-600 hover:text-blue-500">News</a>
                    <div class="relative" id="about-us-public-menu">
                        <button id="about-us-public-toggle" class="text-gray-600 hover:text-blue-500 flex items-center">
                            About Us <i class="fas fa-chevron-down ml-1 text-xs"></i>
                        </button>
                        <div id="about-us-public-dropdown"
                            class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 hidden">
                            <a href="#intro"
                                class="public-nav-link block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Introduction</a>
                            <a href="#faculty"
                                class="public-nav-link block px-4 py-2 mt-1 text-sm text-gray-700 hover:bg-gray-100">Faculty</a>
                        </div>
                    </div>
                </div>
            </nav>
        </header>

        <main class="flex-grow container mx-auto p-6">
            <div id="home-public" class="public-section"></div>
            <div id="news-public" class="public-section hidden"></div>
            <div id="intro-public" class="public-section hidden"></div>
            <div id="faculty-public" class="public-section hidden"></div>
        </main>

        <footer class="bg-white p-4 text-center text-gray-600">
            <p>&copy; 2025 Hamro School. All rights reserved.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
