<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }
    </style>
</head>

<body class="bg-gray-100">

    <div class="flex h-screen bg-gray-200">
        <!-- Sidebar -->
        <div class="w-64 bg-gray-800 text-white flex flex-col">
            <div class="px-8 py-6 border-b border-gray-700">
                <h2 class="text-2xl font-semibold">School Admin</h2>
            </div>
            <nav class="flex-1 px-4 py-4">
                <a href="#dashboard"
                    class="nav-link flex items-center px-4 py-2 text-gray-100 hover:bg-gray-700 rounded-lg">
                    <i class="fas fa-tachometer-alt mr-3"></i> Dashboard
                </a>
                <a href="#students"
                    class="nav-link flex items-center px-4 py-2 mt-2 text-gray-100 hover:bg-gray-700 rounded-lg">
                    <i class="fas fa-user-graduate mr-3"></i> Students
                </a>
                <a href="#teachers"
                    class="nav-link flex items-center px-4 py-2 mt-2 text-gray-100 hover:bg-gray-700 rounded-lg">
                    <i class="fas fa-chalkboard-teacher mr-3"></i> Teachers
                </a>
                <a href="#calendar"
                    class="nav-link flex items-center px-4 py-2 mt-2 text-gray-100 hover:bg-gray-700 rounded-lg">
                    <i class="fas fa-calendar-alt mr-3"></i> Calendar
                </a>
            </nav>
        </div>

        <!-- Main content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <header class="flex justify-between items-center p-6 bg-white border-b-2 border-gray-200">
                <div class="flex items-center">
                    <h1 id="page-title" class="text-3xl font-semibold text-gray-800">Dashboard</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="p-2 rounded-full hover:bg-gray-100">
                        <i class="fas fa-bell text-gray-600"></i>
                    </button>
                    <div class="flex items-center">
                        <img class="h-10 w-10 rounded-full object-cover"
                            src="https://placehold.co/100x100/6366f1/white?text=A" alt="Admin avatar">
                        <span class="ml-3 font-medium text-gray-700">Admin</span>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
                <!-- Dashboard Section -->
                <div id="dashboard" class="section active">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div class="bg-white rounded-lg shadow p-6">
                            <div class="flex items-center">
                                <div class="p-3 rounded-full bg-blue-500 bg-opacity-20">
                                    <i class="fas fa-user-graduate text-blue-500 text-2xl"></i>
                                </div>
                                <div class="ml-4">
                                    <p class="text-gray-600">Total Students</p>
                                    <p id="total-students" class="text-2xl font-semibold text-gray-900">0</p>
                                </div>
                            </div>
                        </div>
                        <div class="bg-white rounded-lg shadow p-6">
                            <div class="flex items-center">
                                <div class="p-3 rounded-full bg-green-500 bg-opacity-20">
                                    <i class="fas fa-chalkboard-teacher text-green-500 text-2xl"></i>
                                </div>
                                <div class="ml-4">
                                    <p class="text-gray-600">Total Teachers</p>
                                    <p id="total-teachers" class="text-2xl font-semibold text-gray-900">0</p>
                                </div>
                            </div>
                        </div>
                        <div class="bg-white rounded-lg shadow p-6">
                            <div class="flex items-center">
                                <div class="p-3 rounded-full bg-yellow-500 bg-opacity-20">
                                    <i class="fas fa-book text-yellow-500 text-2xl"></i>
                                </div>
                                <div class="ml-4">
                                    <p class="text-gray-600">Courses</p>
                                    <p class="text-2xl font-semibold text-gray-900">45</p>
                                </div>
                            </div>
                        </div>
                        <div class="bg-white rounded-lg shadow p-6">
                            <div class="flex items-center">
                                <div class="p-3 rounded-full bg-red-500 bg-opacity-20">
                                    <i class="fas fa-dollar-sign text-red-500 text-2xl"></i>
                                </div>
                                <div class="ml-4">
                                    <p class="text-gray-600">Revenue</p>
                                    <p class="text-2xl font-semibold text-gray-900">$54,250</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Students Section -->
                <div id="students" class="section">
                    <div class="bg-white p-6 rounded-lg shadow">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-xl font-semibold text-gray-800">Student List</h2>
                            <button id="addStudentBtn"
                                class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">Add
                                Student</button>
                        </div>
                        <!-- Grade Filter Dropdown -->
                        <div class="mb-4">
                            <label for="gradeFilter" class="block text-sm font-medium text-gray-700">Filter by
                                Grade:</label>
                            <select id="gradeFilter"
                                class="mt-1 block w-full md:w-1/4 pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
                                <!-- Options will be populated by JS -->
                            </select>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left">
                                <thead>
                                    <tr class="text-gray-600 bg-gray-50">
                                        <th class="py-3 px-4">ID</th>
                                        <th class="py-3 px-4">Name</th>
                                        <th class="py-3 px-4">Grade</th>
                                        <th class="py-3 px-4">Contact</th>
                                        <th class="py-3 px-4">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="student-list" class="text-gray-700">
                                    <!-- Student rows will be injected here by JavaScript -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Teachers Section -->
                <div id="teachers" class="section">
                    <div class="bg-white p-6 rounded-lg shadow">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-xl font-semibold text-gray-800">Teacher List</h2>
                            <button id="addTeacherBtn"
                                class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600">Add
                                Teacher</button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left">
                                <thead>
                                    <tr class="text-gray-600 bg-gray-50">
                                        <th class="py-3 px-4">ID</th>
                                        <th class="py-3 px-4">Name</th>
                                        <th class="py-3 px-4">Subject</th>
                                        <th class="py-3 px-4">Contact</th>
                                        <th class="py-3 px-4">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="teacher-list" class="text-gray-700">
                                    <!-- Teacher rows will be injected here by JavaScript -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Calendar Section -->
                <div id="calendar" class="section">
                    <div class="bg-white p-6 rounded-lg shadow">
                        <h2 class="text-xl font-semibold text-gray-800 mb-4">Events Calendar</h2>
                        <div id="calendar-container"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Add/Edit Student Modal -->
    <div id="studentModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <h3 class="text-lg leading-6 font-medium text-gray-900" id="studentModalTitle">Add Student</h3>
                <div class="mt-2 px-7 py-3">
                    <form id="studentForm">
                        <input type="hidden" id="studentId">
                        <input class="w-full px-3 py-2 text-gray-700 border rounded-lg focus:outline-none mb-3"
                            type="text" id="studentName" placeholder="Name" required>
                        <input class="w-full px-3 py-2 text-gray-700 border rounded-lg focus:outline-none mb-3"
                            type="text" id="studentGrade" placeholder="Grade" required>
                        <input class="w-full px-3 py-2 text-gray-700 border rounded-lg focus:outline-none" type="email"
                            id="studentContact" placeholder="Contact Email" required>
                    </form>
                </div>
                <div class="items-center px-4 py-3">
                    <button id="saveStudentBtn"
                        class="px-4 py-2 bg-blue-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-300">Save</button>
                    <button id="closeStudentModal"
                        class="mt-2 px-4 py-2 bg-gray-200 text-gray-800 text-base font-medium rounded-md w-full shadow-sm hover:bg-gray-300 focus:outline-none">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Teacher Modal -->
    <div id="teacherModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <h3 class="text-lg leading-6 font-medium text-gray-900" id="teacherModalTitle">Add Teacher</h3>
                <div class="mt-2 px-7 py-3">
                    <form id="teacherForm">
                        <input type="hidden" id="teacherId">
                        <input class="w-full px-3 py-2 text-gray-700 border rounded-lg focus:outline-none mb-3"
                            type="text" id="teacherName" placeholder="Name" required>
                        <input class="w-full px-3 py-2 text-gray-700 border rounded-lg focus:outline-none mb-3"
                            type="text" id="teacherSubject" placeholder="Subject" required>
                        <input class="w-full px-3 py-2 text-gray-700 border rounded-lg focus:outline-none" type="email"
                            id="teacherContact" placeholder="Contact Email" required>
                    </form>
                </div>
                <div class="items-center px-4 py-3">
                    <button id="saveTeacherBtn"
                        class="px-4 py-2 bg-green-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-300">Save</button>
                    <button id="closeTeacherModal"
                        class="mt-2 px-4 py-2 bg-gray-200 text-gray-800 text-base font-medium rounded-md w-full shadow-sm hover:bg-gray-300 focus:outline-none">Cancel</button>
                </div>
            </div>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // --- Navigation ---
            const navLinks = document.querySelectorAll('.nav-link');
            const sections = document.querySelectorAll('.section');
            const pageTitle = document.getElementById('page-title');

            function showSection(hash) {
                sections.forEach(section => {
                    if ('#' + section.id === hash) {
                        section.classList.add('active');
                        pageTitle.textContent = hash.charAt(1).toUpperCase() + hash.slice(2);
                    } else {
                        section.classList.remove('active');
                    }
                });
            }

            navLinks.forEach(link => {
                link.addEventListener('click', function (e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('href');
                    window.location.hash = targetId;
                });
            });

            window.addEventListener('hashchange', () => {
                showSection(window.location.hash || '#dashboard');
            });

            // Initial load
            showSection(window.location.hash || '#dashboard');

            // --- Mock Data ---
            let students = [
                { id: 1, name: 'Alice Johnson', grade: '10', contact: 'alice@example.com' },
                { id: 2, name: 'Bob Smith', grade: '11', contact: 'bob@example.com' },
                { id: 3, name: 'Charlie Brown', grade: '9', contact: 'charlie@example.com' },
                { id: 4, name: 'Diana Prince', grade: '10', contact: 'diana@example.com' },
                { id: 5, name: 'Ethan Hunt', grade: '12', contact: 'ethan@example.com' },
            ];

            let teachers = [
                { id: 1, name: 'David Williams', subject: 'Math', contact: 'david.w@example.com' },
                { id: 2, name: 'Emily Davis', subject: 'Science', contact: 'emily.d@example.com' },
                { id: 3, name: 'Frank Miller', subject: 'History', contact: 'frank.m@example.com' },
            ];

            // --- Student Management ---
            const studentList = document.getElementById('student-list');
            const studentModal = document.getElementById('studentModal');
            const addStudentBtn = document.getElementById('addStudentBtn');
            const closeStudentModalBtn = document.getElementById('closeStudentModal');
            const saveStudentBtn = document.getElementById('saveStudentBtn');
            const studentForm = document.getElementById('studentForm');
            const studentModalTitle = document.getElementById('studentModalTitle');
            const gradeFilter = document.getElementById('gradeFilter');

            function populateGradeFilter() {
                const grades = ['All Grades', ...new Set(students.map(s => s.grade).sort((a, b) => a - b))];
                const currentFilter = gradeFilter.value;
                gradeFilter.innerHTML = '';
                grades.forEach(grade => {
                    const option = document.createElement('option');
                    option.value = grade;
                    option.textContent = grade;
                    gradeFilter.appendChild(option);
                });
                gradeFilter.value = currentFilter && grades.includes(currentFilter) ? currentFilter : 'All Grades';
            }

            function renderStudents(filterGrade = 'All Grades') {
                studentList.innerHTML = '';
                const filteredStudents = (filterGrade === 'All Grades' || !filterGrade)
                    ? students
                    : students.filter(s => s.grade === filterGrade);

                if (filteredStudents.length === 0) {
                    studentList.innerHTML = `<tr><td colspan="5" class="text-center py-4">No students found for this grade.</td></tr>`;
                } else {
                    filteredStudents.forEach(s => {
                        studentList.innerHTML += `
                            <tr class="border-b border-gray-200 hover:bg-gray-50">
                                <td class="py-3 px-4">${s.id}</td>
                                <td class="py-3 px-4">${s.name}</td>
                                <td class="py-3 px-4">${s.grade}</td>
                                <td class="py-3 px-4">${s.contact}</td>
                                <td class="py-3 px-4">
                                    <button class="text-blue-500 hover:text-blue-700 mr-2" onclick="editStudent(${s.id})"><i class="fas fa-edit"></i></button>
                                    <button class="text-red-500 hover:text-red-700" onclick="deleteStudent(${s.id})"><i class="fas fa-trash"></i></button>
                                </td>
                            </tr>
                        `;
                    });
                }
            }

            gradeFilter.addEventListener('change', (e) => {
                renderStudents(e.target.value);
            });

            addStudentBtn.addEventListener('click', () => {
                studentModalTitle.textContent = 'Add Student';
                studentForm.reset();
                document.getElementById('studentId').value = '';
                studentModal.classList.remove('hidden');
            });

            closeStudentModalBtn.addEventListener('click', () => {
                studentModal.classList.add('hidden');
            });

            saveStudentBtn.addEventListener('click', () => {
                const id = document.getElementById('studentId').value;
                const name = document.getElementById('studentName').value;
                const grade = document.getElementById('studentGrade').value;
                const contact = document.getElementById('studentContact').value;

                if (name && grade && contact) {
                    if (id) { // Edit
                        const index = students.findIndex(s => s.id == id);
                        students[index] = { id: parseInt(id), name, grade, contact };
                    } else { // Add
                        const newId = students.length > 0 ? Math.max(...students.map(s => s.id)) + 1 : 1;
                        students.push({ id: newId, name, grade, contact });
                    }
                    populateGradeFilter();
                    renderStudents(gradeFilter.value);
                    updateDashboardStats();
                    studentModal.classList.add('hidden');
                }
            });

            window.editStudent = (id) => {
                const student = students.find(s => s.id === id);
                if (student) {
                    studentModalTitle.textContent = 'Edit Student';
                    document.getElementById('studentId').value = student.id;
                    document.getElementById('studentName').value = student.name;
                    document.getElementById('studentGrade').value = student.grade;
                    document.getElementById('studentContact').value = student.contact;
                    studentModal.classList.remove('hidden');
                }
            };

            window.deleteStudent = (id) => {
                // In a real app, you'd show a confirmation dialog.
                students = students.filter(s => s.id !== id);
                populateGradeFilter();
                renderStudents(gradeFilter.value);
                updateDashboardStats();
            };

            // --- Teacher Management ---
            const teacherList = document.getElementById('teacher-list');
            const teacherModal = document.getElementById('teacherModal');
            const addTeacherBtn = document.getElementById('addTeacherBtn');
            const closeTeacherModalBtn = document.getElementById('closeTeacherModal');
            const saveTeacherBtn = document.getElementById('saveTeacherBtn');
            const teacherForm = document.getElementById('teacherForm');
            const teacherModalTitle = document.getElementById('teacherModalTitle');

            function renderTeachers() {
                teacherList.innerHTML = '';
                teachers.forEach(t => {
                    teacherList.innerHTML += `
                        <tr class="border-b border-gray-200 hover:bg-gray-50">
                            <td class="py-3 px-4">${t.id}</td>
                            <td class="py-3 px-4">${t.name}</td>
                            <td class="py-3 px-4">${t.subject}</td>
                            <td class="py-3 px-4">${t.contact}</td>
                            <td class="py-3 px-4">
                                <button class="text-blue-500 hover:text-blue-700 mr-2" onclick="editTeacher(${t.id})"><i class="fas fa-edit"></i></button>
                                <button class="text-red-500 hover:text-red-700" onclick="deleteTeacher(${t.id})"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            }

            addTeacherBtn.addEventListener('click', () => {
                teacherModalTitle.textContent = 'Add Teacher';
                teacherForm.reset();
                document.getElementById('teacherId').value = '';
                teacherModal.classList.remove('hidden');
            });

            closeTeacherModalBtn.addEventListener('click', () => {
                teacherModal.classList.add('hidden');
            });

            saveTeacherBtn.addEventListener('click', () => {
                const id = document.getElementById('teacherId').value;
                const name = document.getElementById('teacherName').value;
                const subject = document.getElementById('teacherSubject').value;
                const contact = document.getElementById('teacherContact').value;

                if (name && subject && contact) {
                    if (id) { // Edit
                        const index = teachers.findIndex(t => t.id == id);
                        teachers[index] = { id: parseInt(id), name, subject, contact };
                    } else { // Add
                        const newId = teachers.length > 0 ? Math.max(...teachers.map(t => t.id)) + 1 : 1;
                        teachers.push({ id: newId, name, subject, contact });
                    }
                    renderTeachers();
                    updateDashboardStats();
                    teacherModal.classList.add('hidden');
                }
            });

            window.editTeacher = (id) => {
                const teacher = teachers.find(t => t.id === id);
                if (teacher) {
                    teacherModalTitle.textContent = 'Edit Teacher';
                    document.getElementById('teacherId').value = teacher.id;
                    document.getElementById('teacherName').value = teacher.name;
                    document.getElementById('teacherSubject').value = teacher.subject;
                    document.getElementById('teacherContact').value = teacher.contact;
                    teacherModal.classList.remove('hidden');
                }
            };

            window.deleteTeacher = (id) => {
                teachers = teachers.filter(t => t.id !== id);
                renderTeachers();
                updateDashboardStats();
            };


            // --- Calendar ---
            const calendarContainer = document.getElementById('calendar-container');
            let currentDate = new Date();

            function renderCalendar() {
                const month = currentDate.getMonth();
                const year = currentDate.getFullYear();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const firstDayOfMonth = new Date(year, month, 1).getDay();
                const today = new Date();

                let calendarHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <button id="prev-month" class="px-3 py-1 bg-gray-200 rounded-lg hover:bg-gray-300">&lt;</button>
                        <h3 class="text-lg font-semibold">${currentDate.toLocaleString('default', { month: 'long' })} ${year}</h3>
                        <button id="next-month" class="px-3 py-1 bg-gray-200 rounded-lg hover:bg-gray-300">&gt;</button>
                    </div>
                    <div class="grid grid-cols-7 gap-2 text-center text-sm text-gray-600 mb-2">
                        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                    </div>
                    <div class="grid grid-cols-7 gap-2">
                `;

                for (let i = 0; i < firstDayOfMonth; i++) {
                    calendarHTML += `<div class="p-2 rounded-lg"></div>`;
                }

                for (let day = 1; day <= daysInMonth; day++) {
                    let classes = 'p-2 rounded-lg hover:bg-blue-100 cursor-pointer';
                    if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                        classes += ' bg-blue-500 text-white';
                    }
                    calendarHTML += `<div class="${classes}">${day}</div>`;
                }

                calendarHTML += `</div>`;
                calendarContainer.innerHTML = calendarHTML;

                document.getElementById('prev-month').addEventListener('click', () => {
                    currentDate.setMonth(currentDate.getMonth() - 1);
                    renderCalendar();
                });
                document.getElementById('next-month').addEventListener('click', () => {
                    currentDate.setMonth(currentDate.getMonth() + 1);
                    renderCalendar();
                });
            }

            // --- Dashboard Stats ---
            function updateDashboardStats() {
                document.getElementById('total-students').textContent = students.length;
                document.getElementById('total-teachers').textContent = teachers.length;
            }

            // --- Initial Render ---
            populateGradeFilter();
            renderStudents();
            renderTeachers();
            renderCalendar();
            updateDashboardStats();
        });
    </script>
</body>

</html>
